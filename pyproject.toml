[project]
name = "terminalclub-api"
version = "0.1.0"
description = "Backend for TerminalClub Site"
readme = "README.md"
authors = [
    { name = "Andrii Demchuk" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]

# Enables all strict checks (disallows functions without type annotations, strict Optional, etc.)
strict = true

# Improves the readability of errors in the terminal
pretty = true

files = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
